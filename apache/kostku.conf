# Konfigurasi Apache VirtualHost untuk domain kostku.juns-digital.my.id
# Letakkan di: /etc/apache2/sites-available/kostku.conf
# Jalankan: sudo a2enmod proxy proxy_http headers
# Aktifkan: sudo a2ensite kostku.conf
# Reload: sudo systemctl reload apache2
# SSL Certbot: sudo certbot --apache -d kostku.juns-digital.my.id

<VirtualHost *:80>
    ServerName kostku.juns-digital.my.id

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    # WebSockets support for Next.js HMR/Live
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:3002/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://127.0.0.1:3002/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/kostku_error.log
    CustomLog ${APACHE_LOG_DIR}/kostku_access.log combined
</VirtualHost>
