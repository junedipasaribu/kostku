services:
  postgres:
    image: postgres:15-alpine
    container_name: kostku-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-kostku_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kostku_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kostku_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    image: ${APP_IMAGE:-ghcr.io/junedipasaribu/kostku:latest}
    container_name: kostku-app-prod
    ports:
      - "${HOST_PORT:-3002}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kostku_db}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://kostku.juns-digital.my.id}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://kostku.juns-digital.my.id}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  kostku_postgres_data_prod:
