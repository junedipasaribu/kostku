services:
  postgres:
    image: postgres:15-alpine
    container_name: kostku-db-dev
    environment:
      POSTGRES_DB: kostku_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - kostku_postgres_data_dev:/var/lib/postgresql/data
    restart: always

volumes:
  kostku_postgres_data_dev:
